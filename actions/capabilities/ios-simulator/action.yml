name: iOS Simulator
description: >
  Boot iOS simulator.
  macOS: boots via simulator-action. Linux/Windows: not supported (requires Xcode).

inputs:
  model:
    description: "Simulator device model"
    required: false
    default: 'iPhone 16'

runs:
  using: composite
  steps:
    - uses: futureware-tech/simulator-action@c768f52966d5f70335ec77881f9806b24a52f80e # v6
      with:
        model: ${{ inputs.model }}
