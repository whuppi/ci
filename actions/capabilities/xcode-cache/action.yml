name: Xcode Cache
description: Cache Xcode derived data for Apple builds.

inputs:
  target:
    description: "ios or macos — used in cache key"
    required: true
  key-extra:
    description: "Optional extra cache-key segment (e.g. a dependency revision)"
    required: false
    default: ''
  save:
    description: >
      Whether this run may write the cache. GitHub scopes caches to the ref
      that wrote them and lets a PR read only its base and the default
      branch, so a PR's writes are invisible to every other PR and only
      spend quota. Pass 'false' from PR runs; the default branch warms.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - uses: irgaly/xcode-cache@4141f139f00e335c6e1031fb93e667181f86146f # v1.9.2
      with:
        key: xcode-${{ runner.os }}-${{ runner.arch }}-${{ inputs.target }}-${{ inputs.key-extra }}
        restore-keys: xcode-${{ runner.os }}-${{ runner.arch }}-${{ inputs.target }}-
        cache-read-only: ${{ inputs.save != 'true' }}
