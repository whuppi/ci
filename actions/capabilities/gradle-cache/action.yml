name: Gradle Cache
description: >
  Cache Gradle downloads for Android builds.
  Two-phase: restore runs as a pre-step, save runs as a post-step
  with daemon stop to release Windows file locks.

inputs:
  phase:
    description: "'restore' before build, 'save' after build"
    required: true
  save:
    description: >
      Whether the 'save' phase may write. GitHub scopes caches to the ref
      that wrote them and lets a PR read only its base and the default
      branch, so a PR's writes are invisible to every other PR and only
      spend quota (a Gradle home is ~1 GB per OS). Pass 'false' from PR
      runs; the default branch warms.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Restore Gradle cache
      if: inputs.phase == 'restore'
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('example/android/build.gradle.kts', 'example/android/app/build.gradle.kts') }}
        restore-keys: gradle-${{ runner.os }}-${{ runner.arch }}-

    # The two phases are separate action invocations, so the restore's
    # exact-hit result crosses to the save phase through the job env.
    - name: Remember the restore result
      if: inputs.phase == 'restore'
      shell: bash
      env:
        HIT: ${{ steps.restore.outputs.cache-hit }}
      run: echo "GRADLE_CACHE_EXACT_HIT=${HIT:-false}" >> "$GITHUB_ENV"

    # Skip the save after an exact hit: GitHub never overwrites an existing
    # key, so the save would tar ~1 GB (two minutes on Windows) only to be
    # refused with "Unable to reserve cache". A restore-keys prefix hit is
    # NOT exact and still saves — that is how the cache follows a Gradle
    # file change.
    - name: Stop Gradle daemon
      if: inputs.phase == 'save' && inputs.save == 'true' && env.GRADLE_CACHE_EXACT_HIT != 'true'
      continue-on-error: true
      shell: bash
      run: cd example/android && ./gradlew --stop 2>/dev/null || true

    - name: Save Gradle cache
      if: inputs.phase == 'save' && inputs.save == 'true' && env.GRADLE_CACHE_EXACT_HIT != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      continue-on-error: true
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('example/android/build.gradle.kts', 'example/android/app/build.gradle.kts') }}
