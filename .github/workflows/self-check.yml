# whuppi/ci's own PR gate. Lints this repo's workflows + composite actions +
# shell, checks the PR title, verifies the pinned assets are still reachable,
# and guards the stamping rule: internal refs on main must say @main (a stamped
# version tag leaking into main would freeze internals at an old release).
name: Self Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conventional-commit:
    name: Conventional Commit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check PR title
        shell: bash
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          types=$(paste -sd'|' tool/commit-types.txt)
          if ! grep -qE "^(${types})(\(.+\))?!?: .+" <<< "$TITLE"; then
            echo "::error::PR title must follow Conventional Commits format."
            printf '  Types: %s\n' "$(paste -sd' ' tool/commit-types.txt)"
            echo "  Your title: $TITLE"
            exit 1
          fi
          echo "✓ PR title is valid: $TITLE"

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: zizmor (security — workflows + composite actions)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source tool/versions.env
          pipx run "zizmor==$ZIZMOR_VERSION" --persona=auditor .github/ actions/
      - name: actionlint (workflow correctness)
        shell: bash
        run: |
          source tool/versions.env
          go install "github.com/rhysd/actionlint/cmd/actionlint@v$ACTIONLINT_VERSION"
          PATH="$(go env GOPATH)/bin:$PATH"
          actionlint -color
      - name: shell lint (portability)
        shell: bash
        run: bash tool/lint_shell.sh

  action-yaml-parse:
    name: Action YAML parse
    # actionlint covers .github/workflows only; parse the composite action.yml
    # files too so a malformed capability action fails the PR, not a consumer.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Parse every action.yml
        shell: bash
        run: |
          files=$(git ls-files 'actions/*/action.yml' 'actions/*/*/action.yml')
          # shellcheck disable=SC2086
          python3 -c 'import sys, yaml; [yaml.safe_load(open(f)) for f in sys.argv[1:]]; print("YAML parse OK (%d action files)" % (len(sys.argv) - 1))' $files

  internal-refs-are-main:
    name: Internal refs are @main
    # The stamping guard: fail if any internal whuppi/ci reference on main
    # carries a version tag. the release stamps @main → the release tag in a
    # detached commit; a stamped ref leaking back into main would freeze
    # internals forever.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No version-tagged internal refs on main
        shell: bash
        run: |
          # Only real `uses:` keys, never a commented illustration (doc examples
          # in an action header legitimately show a consumer the @vX.Y.Z pin).
          bad=$(grep -rnE 'uses:[[:space:]]*whuppi/ci[^@[:space:]]*@' .github/workflows/ actions/ \
            | grep -v '@main' \
            | grep -vE '^[^:]+:[0-9]+:[[:space:]]*#' || true)
          if [ -n "$bad" ]; then
            printf '%s\n' "$bad"
            echo "::error::internal whuppi/ci refs on main must be @main (the release stamps tags)"
            exit 1
          fi
          ref_bad=$(grep -rn -A3 'repository: whuppi/ci' .github/workflows/ \
            | grep -E '[[:space:]]ref:' | grep -v 'ref: main' || true)
          if [ -n "$ref_bad" ]; then
            printf '%s\n' "$ref_bad"
            echo "::error::checkout of whuppi/ci on main must use ref: main"
            exit 1
          fi
          echo "✓ all internal whuppi/ci refs are @main"

  pin-availability:
    name: Pin availability
    # HEADs every pinned asset so a pruned pin fails the PR, before it fails a
    # consumer's build. (This job lived in the package's pr-checks; the pins
    # live in whuppi/ci now, so the check does too.)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned assets still reachable
        shell: bash
        run: bash tool/ci/upgrade.sh check-availability

  # The one capability whose correctness cannot be linted: a real save +
  # restore against GHCR on every OS. Same-repo PRs only (a fork PR has a
  # read-only token and the job is skipped rather than red).
  oci-cache-roundtrip:
    name: oci-cache round-trip (${{ matrix.os }})
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write  # push the round-trip archive to ghcr.io/whuppi/ci/cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Make something to cache
        shell: bash
        run: |
          mkdir -p "$HOME/.selfcheck-cache/nested"
          head -c 3000000 /dev/urandom > "$HOME/.selfcheck-cache/nested/blob.bin"
          echo "hello" > "$HOME/.selfcheck-cache/marker.txt"
          sha256sum < "$HOME/.selfcheck-cache/nested/blob.bin" | cut -d' ' -f1 > "$RUNNER_TEMP/expected.sha"
      - name: Save
        uses: ./actions/capabilities/oci-cache
        with:
          phase: save
          name: selfcheck
          key: ${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          fallback: ${{ runner.os }}-${{ runner.arch }}-latest
          path: ~/.selfcheck-cache
      - name: Wipe
        shell: bash
        run: rm -rf "$HOME/.selfcheck-cache"
      - name: Restore (exact)
        id: exact
        uses: ./actions/capabilities/oci-cache
        with:
          phase: restore
          name: selfcheck
          key: ${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ~/.selfcheck-cache
      - name: Verify exact
        shell: bash
        env:
          HIT: ${{ steps.exact.outputs.cache-hit }}
        run: |
          set -euo pipefail
          [ "$HIT" = true ] || { echo "::error::exact restore reported a miss"; exit 1; }
          [ "$(cat "$HOME/.selfcheck-cache/marker.txt")" = hello ]
          [ "$(sha256sum < "$HOME/.selfcheck-cache/nested/blob.bin" | cut -d' ' -f1)" = "$(cat "$RUNNER_TEMP/expected.sha")" ]
          echo "exact round-trip OK"
          rm -rf "$HOME/.selfcheck-cache"
      - name: Restore (fallback)
        id: fb
        uses: ./actions/capabilities/oci-cache
        with:
          phase: restore
          name: selfcheck
          key: ${{ runner.os }}-${{ runner.arch }}-no-such-key
          fallback: ${{ runner.os }}-${{ runner.arch }}-latest
          path: ~/.selfcheck-cache
      - name: Verify fallback
        shell: bash
        env:
          HIT: ${{ steps.fb.outputs.cache-hit }}
        run: |
          set -euo pipefail
          [ "$HIT" = false ] || { echo "::error::fallback restore must not report an exact hit"; exit 1; }
          [ "$(cat "$HOME/.selfcheck-cache/marker.txt")" = hello ]
          echo "fallback round-trip OK"
